[package]
name = "rust-bevy-jev-ants"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19"
rand = "0.9"
bevy_egui = "0.42"
ehttp = { version = "0.7", features = ["json"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dotenvy = "0.15"

# Bevy is painfully slow in a debug build unless its dependencies are optimised.
[profile.dev.package."*"]
opt-level = 3
